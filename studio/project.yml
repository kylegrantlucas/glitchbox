name: VideobedStudio
options:
  bundleIdPrefix: com.kylegrantlucas
  deploymentTarget: { macOS: "26.0" }
packages:
  VideobedKit: { path: VideobedKit }
targets:
  VideobedStudio:
    type: application
    platform: macOS
    sources: [App]
    dependencies: [{ package: VideobedKit, product: VideobedKit }]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Videobed Studio
        VBRootHint: $(SRCROOT)/..
    settings:
      base:
        PRODUCT_NAME: VideobedStudio
        PRODUCT_BUNDLE_IDENTIFIER: com.kylegrantlucas.videobed-studio
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: NO        # spawns nix and arbitrary CLI tools
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        ALWAYS_SEARCH_USER_PATHS: NO
