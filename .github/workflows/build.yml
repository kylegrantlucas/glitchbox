# Build, test, and package Glitchbox.app on GitHub's Xcode 27 (Apple silicon)
# image; draft a GitHub Release for v* tags. Release runs (v* tags, or a manual
# run with release-dry-run) sign with the Developer ID, notarize, and build the
# source bundle; other runs stay ad-hoc signed.
#
# packaging/build.sh skips any toolchain stage whose stamp (a hash of its
# recipe, pinned inputs, and dependencies' stamps) matches, so the stamped
# outputs are cached together with their stamps. See the cache steps below.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release-dry-run:
        description: Sign, notarize, and build the source bundle as a release would (no release is drafted)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Pinned rather than the image defaults (Rust 1.99, Xcode 27.0 today):
  # bender-rs needs Rust >= 1.96, and both are part of the stage cache key.
  RUST_TOOLCHAIN: "1.97.0"
  XCODE_APP: /Applications/Xcode_27.0.app

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read packaging/VERSION
        id: version
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release-dry-run == true }}
        run: |
          version=$(tr -d '[:space:]' < packaging/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=Glitchbox-$version-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      # Before any build minutes are spent: a release tag must name the version
      # the DMG is built with.
      - name: Check tag matches packaging/VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packaging/VERSION ($VERSION)"
            exit 1
          fi

      - name: Select toolchain
        id: toolchain
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
          cmake --version | sed -n 1p
          jq --version
          curl --version | sed -n 1p
          xcode=$(xcodebuild -version | awk '/Build version/ { print $3 }')
          echo "key=xcode-$xcode-rust-$RUST_TOOLCHAIN" >> "$GITHUB_OUTPUT"
          df -h "$GITHUB_WORKSPACE"

      # build.sh's licenses stage lists the Rust crates in ntsc-rs-cli and bender.
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Swift tests (GlitchboxKit)
        working-directory: app/GlitchboxKit
        # Same scrubbed environment build.sh uses for xcodebuild/swift.
        run: env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" LANG=C LC_ALL=C TERM=dumb PATH=/usr/bin:/bin:/usr/sbin:/sbin swift test

      # Pinned inputs and the cargo registry (build/downloads/cargo-home).
      # fetch re-verifies every file's sha256 and cargo checks crates against
      # the pinned lockfiles, so a restored file is never trusted blindly. No
      # restore-keys: a sources.json change starts clean instead of dragging
      # superseded downloads along forever.
      - name: Cache downloads
        uses: actions/cache@v6
        with:
          path: build/downloads
          key: downloads-v1-${{ hashFiles('packaging/sources.json') }}

      # Stamped stage outputs: build/stamps plus everything the stages write
      # that later stages and assembly read (build/prefix: frei0r and the
      # finished binaries; build/gst: full, sdk, runtime). Each stage
      # rebuilds whenever its stamp doesn't match, and gst/gst_runtime/frei0r
      # delete their output first, so restoring an older entry (restore-keys)
      # or one saved by a failed run is safe: it can only skip stages whose
      # recipe, inputs, and dependencies are unchanged. The cargo target dirs
      # are deleted by build.sh after each build, so there are none to cache.
      # Compilers are not in the stamps, so the pinned Xcode build and Rust
      # version are in the key.
      - name: Restore stage cache
        id: stages
        uses: actions/cache/restore@v6
        with:
          path: |
            build/stamps
            build/prefix
            build/gst
          key: stages-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('packaging/sources.json', 'packaging/build.sh') }}
          restore-keys: |
            stages-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('packaging/sources.json', 'packaging/build.sh') }}-
            stages-v1-${{ steps.toolchain.outputs.key }}-

      # A restore that failed partway leaves no matched key but may leave
      # files behind; a stamp without its complete outputs must not survive.
      - name: Discard incomplete stage restore
        if: steps.stages.outputs.cache-matched-key == ''
        run: rm -rf build/stamps build/prefix build/gst

      # Release runs only: a throwaway keychain holding the Developer ID
      # Application certificate, and the App Store Connect API key notarytool
      # uses. Removed again by "Remove signing material".
      - name: Import signing certificate
        if: steps.version.outputs.release == 'true'
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=
          for v in P12 P12_PASSWORD IDENTITY NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::release signing secrets are empty:$missing (MACOS_DEVELOPER_ID_P12, MACOS_DEVELOPER_ID_P12_PASSWORD, MACOS_SIGN_IDENTITY, NOTARY_KEY_P8, NOTARY_KEY_ID, NOTARY_ISSUER_ID)"
            exit 1
          fi
          kc=$RUNNER_TEMP/signing.keychain-db
          kc_password=$(openssl rand -base64 32)
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          {
            echo "GLITCHBOX_SIGN_IDENTITY=$IDENTITY"
            echo "GLITCHBOX_NOTARY_KEY_FILE=$RUNNER_TEMP/notary.p8"
            echo "GLITCHBOX_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "GLITCHBOX_NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"

      - name: packaging/build.sh all
        id: build
        run: packaging/build.sh all

      # Saved after failures too (stamps are written only after a stage
      # succeeds), keyed by the stamps themselves so a later, more complete
      # build is never blocked by an existing key.
      - name: Stage cache key
        id: stamps
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          PREFIX: stages-v1-${{ steps.toolchain.outputs.key }}-${{ hashFiles('packaging/sources.json', 'packaging/build.sh') }}
        run: |
          [ -d build/stamps ] && [ -n "$(ls build/stamps)" ] || exit 0
          h=$(cd build/stamps && for f in *; do printf '%s %s\n' "$f" "$(cat "$f")"; done | shasum -a 256 | cut -c1-16)
          echo "key=$PREFIX-$h" >> "$GITHUB_OUTPUT"

      - name: Save stage cache
        if: ${{ !cancelled() && steps.stamps.outputs.key != '' && steps.stamps.outputs.key != steps.stages.outputs.cache-matched-key }}
        uses: actions/cache/save@v6
        with:
          path: |
            build/stamps
            build/prefix
            build/gst
          key: ${{ steps.stamps.outputs.key }}

      # Stapling rewrites the app and the DMG, so this runs before the checksum.
      - name: Notarize
        if: steps.version.outputs.release == 'true'
        run: packaging/build.sh notarize

      - name: Checksum DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: build/dist
        run: |
          shasum -a 256 "Glitchbox-$VERSION.dmg" > "Glitchbox-$VERSION.dmg.sha256"
          cat "Glitchbox-$VERSION.dmg.sha256"
          ls -l

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            build/dist/Glitchbox-${{ steps.version.outputs.version }}.dmg
            build/dist/Glitchbox-${{ steps.version.outputs.version }}.dmg.sha256
          if-no-files-found: error
          compression-level: 0 # UDZO is already compressed
          retention-days: 14

      - name: Source bundle
        if: steps.version.outputs.release == 'true'
        run: packaging/build.sh sources

      - name: Upload source bundle
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}-sources
          path: |
            build/dist/Glitchbox-${{ steps.version.outputs.version }}-sources.tar
            build/dist/Glitchbox-${{ steps.version.outputs.version }}-sources.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_attempt }}
          path: build/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Disk usage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh build/* build/gst/* 2>/dev/null || true

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}-sources
          path: dist

      - name: Create draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          dmg=Glitchbox-$VERSION.dmg
          src=Glitchbox-$VERSION-sources.tar
          shasum -a 256 -c "$dmg.sha256"
          shasum -a 256 -c "$src.sha256"
          sum=$(cut -d' ' -f1 "$dmg.sha256")
          cat > notes.md <<EOF
          Glitchbox $VERSION, built from \`$TAG\` ($GITHUB_SHA).

          Apple silicon Macs, macOS 26 or later. Open \`$dmg\` and drag Glitchbox to
          Applications. Signed with a Developer ID and notarized by Apple.

          Complete corresponding source: \`$src\`.

          SHA-256 (\`$dmg\`): \`$sum\`
          EOF
          # A rerun updates the existing draft instead of adding a second one.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" "$dmg.sha256" "$src" "$src.sha256" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$dmg" "$dmg.sha256" "$src" "$src.sha256" --draft --verify-tag \
              --title "Glitchbox $VERSION" --notes-file notes.md
          fi
          gh release view "$TAG" --json isDraft,tagName,assets \
            --jq '{isDraft, tagName, assets: [.assets[] | {name, size}]}'
